plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "app.nexora.messenger"
    compileSdk 36

    defaultConfig {
        applicationId "app.nexora.messenger"
        minSdk 24
        targetSdk 35
        ndk {
            // Nexora's primary Android target is 64-bit ARM phones.
            // Excluding unused ABIs keeps the debug APK significantly smaller.
            abiFilters "arm64-v8a"
        }
        versionCode 2
        versionName "0.2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Official Matrix Rust SDK Android bindings. Includes the protocol/crypto
    // implementation; Nexora must use this API for E2EE rather than custom crypto.
    implementation "org.matrix.rustcomponents:sdk-android:26.10.15"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
