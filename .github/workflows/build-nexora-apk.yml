name: Build Nexora APK

on:
  workflow_dispatch:
  push:
    branches:
      - nexora-dev
    paths:
      - "Nexora/**"
      - ".github/workflows/build-nexora-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nexora-dev
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        id: android
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the runner Android SDK"
            find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "Using $SDKMANAGER"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "${{ steps.android.outputs.sdkmanager }}" --licenses >/dev/null || true
          "${{ steps.android.outputs.sdkmanager }}" "platforms;android-36" "build-tools;36.0.0"

      - name: Build Nexora debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -p Nexora :app:assembleDebug

      - name: Verify APK exists
        run: |
          APK="Nexora/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-Android-debug
          path: Nexora/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
