name: Etleg Android Preview

on:
  pull_request:
    branches:
      - etleg-account-isolation

permissions:
  contents: read

concurrency:
  group: etleg-android-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build Etleg debug APK
        run: |
          chmod +x gradlew
          # Keep preview builds focused on modern 64-bit Android devices.
          # Enable FCM only when the Firebase file explicitly registers this
          # exact Etleg application ID. Never reuse Telegram's Firebase client.
          python3 - <<'PY'
          import json
          from pathlib import Path

          properties = {}
          for raw_line in Path("gradle.properties").read_text().splitlines():
              line = raw_line.strip()
              if line and not line.startswith("#") and "=" in line:
                  key, value = line.split("=", 1)
                  properties[key.strip()] = value.strip()

          app_package = properties.get("APP_PACKAGE")
          if not app_package:
              raise SystemExit("APP_PACKAGE is missing from gradle.properties.")

          build_file = Path("TMessagesProj_AppStandalone/build.gradle")
          source = build_file.read_text()
          full_abi_list = 'abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"'
          arm64_only = 'abiFilters "arm64-v8a"'
          google_services_plugin = "apply plugin: 'com.google.gms.google-services'"
          if source.count(full_abi_list) != 1:
              raise SystemExit("Expected standalone ABI filter was not found exactly once.")
          if source.count(google_services_plugin) != 1:
              raise SystemExit("Expected standalone Google Services plugin was not found exactly once.")
          source = source.replace(full_abi_list, arm64_only)

          firebase_file = Path("TMessagesProj_AppStandalone/google-services.json")
          firebase_package = app_package + ".web"  # standalone debug applicationIdSuffix
          has_matching_firebase_client = False
          if firebase_file.is_file():
              try:
                  config = json.loads(firebase_file.read_text())
                  has_matching_firebase_client = any(
                      client.get("client_info", {}).get("android_client_info", {}).get("package_name")
                      == firebase_package
                      for client in config.get("client", [])
                  )
              except (ValueError, OSError) as error:
                  raise SystemExit(f"Firebase configuration is invalid: {error}")

          if has_matching_firebase_client:
              print(f"Firebase configuration found for {firebase_package}; keeping Google Services enabled.")
          else:
              print(
                  f"WARNING: no Firebase client for {firebase_package}. "
                  "Building without FCM. Add an Etleg Firebase app and matching google-services.json to enable push."
              )
              source = source.replace(
                  google_services_plugin,
                  "// Google Services disabled: no matching Etleg Firebase application is registered."
              )

          build_file.write_text(source)
          PY
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Etleg-Android-Preview-arm64
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
