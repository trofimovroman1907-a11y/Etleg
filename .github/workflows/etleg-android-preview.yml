name: Etleg Android Preview

on:
  pull_request:
    branches:
      - etleg-account-isolation

permissions:
  contents: read

concurrency:
  group: etleg-android-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          yes | sdkmanager --licenses

      - name: Build Etleg debug APK
        run: |
          chmod +x gradlew
          # The fork uses its own applicationId, while the checked-in Firebase
          # configuration only registers upstream Telegram package names.
          # Skip Firebase resource generation for this preview APK; core Android
          # compilation can still be checked, but Firebase push integration is
          # intentionally not validated by this build.
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug \
            -x :TMessagesProj_AppStandalone:processAfatDebugGoogleServices \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Etleg-Android-Preview
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
