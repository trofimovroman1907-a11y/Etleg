name: Apply Etleg changes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and create branch
        run: |
          git apply --check etleg-initial.patch
          git switch -c etleg-changes
          git apply etleg-initial.patch
          git diff --check
          git add TMessagesProj gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add initial Etleg changes"
          git push origin HEAD:refs/heads/etleg-changes
