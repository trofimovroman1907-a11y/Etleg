      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android tools
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          result=${PIPESTATUS[1]}
          set -o pipefail
          exit "$result"
      - name: Check Java compilation
        shell: bash
        run: |
          bash ./gradlew --no-daemon --no-parallel --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=768m" \
            -Pkotlin.compiler.execution.strategy=in-process \
            :TMessagesProj:compileDebugJavaWithJavac
      - name: Save checked source in a new branch
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TMessagesProj/src/main/java/org/telegram/ui/EtlegSettingsActivity.java TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java TMessagesProj/src/main/java/org/telegram/ui/ProfileActivity.java TMessagesProj/src/main/java/org/telegram/ui/ThemeActivity.java TMessagesProj/src/main/res/values/strings.xml TMessagesProj/src/main/res/values-ru/strings.xml
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No design changes to save.'; exit 1; }
          git commit -m 'Add Etleg customization hub and guard test backend'
          AUTH=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/etleg-settings-stage1
          echo '::notice::Settings source saved to etleg-settings-stage1. No APK was built.'
